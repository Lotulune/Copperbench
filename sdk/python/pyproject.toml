[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copperbench"
version = "0.1.0"
description = "Copperbench local Core Python API and optional MCP client"
requires-python = ">=3.11"

[tool.setuptools]
py-modules = ["copperbench", "copperbench_native", "copperbench_scripting", "copperbench_console"]
