import groovy.xml.XmlSlurper
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest
import java.time.LocalDateTime
import java.util.zip.CRC32
import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

// Loom 1.17.21 generates this artifact locally. Its directory timestamps and ZIP
// order vary across empty caches. Normalize only its container; every entry byte
// remains covered by the single pinned SHA-256 and Gradle's strict verification.
def digestOf = { File path ->
    def digest = MessageDigest.getInstance('SHA-256')
    path.withInputStream { input ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
    }
    digest.digest().encodeHex().toString()
}

gradle.projectsEvaluated {
    def module = 'minecraft-merged-7e9a32a5b8'
    def artifact = module + '-26.3.jar'
    def metadata = new XmlSlurper(false, false).parse(file('gradle/verification-metadata.xml'))
    def checksums = metadata.components.component.findAll {
        it.@group == 'net.minecraft' && it.@name == module && it.@version == '26.3'
    }.artifact.findAll { it.@name == artifact }.sha256.collect { it.@value.text() }
    if (checksums.size() != 1 || !(checksums[0] ==~ /[0-9a-f]{64}/))
        throw new GradleException('COPPERBENCH_LOCAL_MINECRAFT_CHECKSUM_MISSING: expected one pinned SHA-256 for ' + artifact)
    def expected = checksums[0]
    def cacheRoot = gradle.startParameter.projectCacheDir ?: rootProject.file('.gradle')
    def jar = new File(cacheRoot, 'loom-cache/minecraftMaven/net/minecraft/' + module + '/26.3/' + artifact)
    if (!jar.isFile()) throw new GradleException('COPPERBENCH_LOCAL_MINECRAFT_MISSING: ' + jar)
    if (digestOf(jar) == expected) return

    def temporary = Files.createTempFile(jar.parentFile.toPath(), 'canonical-', '.jar')
    try {
        new ZipFile(jar).withCloseable { source ->
            def entries = Collections.list(source.entries()).sort { it.name }
            if (entries.collect { it.name }.toSet().size() != entries.size())
                throw new GradleException('COPPERBENCH_LOCAL_MINECRAFT_DUPLICATE_ENTRY: ' + jar)
            new ZipOutputStream(Files.newOutputStream(temporary)).withCloseable { target ->
                entries.each { entry ->
                    byte[] bytes = source.getInputStream(entry).withCloseable { it.readAllBytes() }
                    def crc = new CRC32()
                    crc.update(bytes)
                    def normalized = new ZipEntry(entry.name)
                    // Avoid the DOS epoch sentinel, which adds timezone-dependent extras.
                    normalized.setTimeLocal(LocalDateTime.of(1980, 1, 2, 0, 0))
                    // STORED avoids platform/JDK compression differences.
                    normalized.method = ZipEntry.STORED
                    normalized.size = bytes.length
                    normalized.compressedSize = bytes.length
                    normalized.crc = crc.value
                    target.putNextEntry(normalized)
                    target.write(bytes)
                    target.closeEntry()
                }
            }
        }
        def observed = digestOf(temporary.toFile())
        if (observed != expected)
            throw new GradleException('COPPERBENCH_LOCAL_MINECRAFT_CONTENT_MISMATCH: ' + jar
                    + '; expected ' + expected + ', observed ' + observed)
        Files.move(temporary, jar.toPath(), StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING)
        logger.info('Verified canonical local Minecraft JAR: ' + expected)
    } finally {
        Files.deleteIfExists(temporary)
    }
}
