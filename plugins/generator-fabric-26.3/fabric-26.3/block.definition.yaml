templates:
  - template: block.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/block/@NAMEBlock.java"
  - template: block-model.json.ftl
    writer: json
    name: "@MODASSETSROOT/models/block/@registryname.json"
  - template: block-state.json.ftl
    writer: json
    name: "@MODASSETSROOT/blockstates/@registryname.json"
  - template: block-client.json.ftl
    writer: json
    name: "@MODASSETSROOT/items/@registryname.json"
  - template: block-loot.json.ftl
    writer: json
    name: "@MODDATAROOT/loot_table/blocks/@registryname.json"

localizationkeys:
  - key: block.@modid.@registryname
    mapto: name

field_inclusions: [name, texture, hardness, resistance, rotationMode, maxStackSize, rarity]
