templates:
  - template: item.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/item/@NAMEItem.java"
  - template: item-model.json.ftl
    writer: json
    name: "@MODASSETSROOT/models/item/@registryname.json"
  - template: item-client.json.ftl
    writer: json
    name: "@MODASSETSROOT/items/@registryname.json"

localizationkeys:
  - key: item.@modid.@registryname
    mapto: name

field_inclusions: [name, texture, stackSize, rarity, immuneToFire, fuelBurnTime, compostingLayers]
