plugins {
    id 'fabric-loom' version '1.7.4'
}

version = '1.0'
base.archivesName = "modid"

loom {
    if (file("src/main/resources/META-INF/${modid}.classtweaker").exists())
        accessWidenerPath = file("src/main/resources/META-INF/${modid}.classtweaker")
}

dependencies {
    minecraft "com.mojang:minecraft:${generator.getGeneratorMinecraftVersion()}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.15.11"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${generator.getGeneratorBuildFileVersion()}+${generator.getGeneratorMinecraftVersion()}"
}

// We need to do this because MCreator doesn't allow to split armor textures in multiple folders
tasks.named('processResources', ProcessResources) {
    doLast {
        copy {
            from(layout.buildDirectory.dir("resources/main/assets/${modid}/textures/entity/equipment/humanoid"))
            into(layout.buildDirectory.dir("resources/main/assets/${modid}/textures/entity/equipment/humanoid_leggings"))
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

apply from: 'mcreator.gradle'
