import java.nio.file.Files
import java.util.zip.ZipEntry
import java.util.zip.ZipOutputStream

class FixtureDownloadRequest {
    String source
    String destination
    void src(Object value) { source = value.toString() }
    void dest(Object value) { destination = value.toString() }
    void overwrite(boolean value) {}
}

def scenario = providers.gradleProperty('scenario').get()
def downloads = []
ext.idea = [project: null]
ext.download = [run: { Closure configure ->
    def request = new FixtureDownloadRequest()
    def configured = configure.rehydrate(request, configure.owner, configure.thisObject)
    configured.resolveStrategy = Closure.DELEGATE_ONLY
    configured.call()
    def role = request.source.endsWith('/LockedList.zip') ? 'plugin' : 'compiler'
    downloads.add(role)
    def destination = file(request.destination)
    destination.parentFile.mkdirs()
    Files.copy(file("fixtures/${role}.zip").toPath(), destination.toPath())
}]

apply from: 'setup-under-test.gradle'

tasks.register('prepareNsisFixture') {
    doLast {
        if (file('build/tools').exists()) throw new GradleException('Use a fresh fixture directory')
        def archives = [
                compiler: ['nsis-3.12/makensis.exe': 'compiler-fixture',
                           'nsis-3.12/Include/MUI2.nsh': 'include-fixture'],
                plugin: ['Plugins/x86-unicode/LockedList.dll': 'plugin-fixture']
        ]
        if (scenario == 'malformed') archives.compiler.remove('nsis-3.12/makensis.exe')
        file('fixtures').mkdirs()
        archives.each { role, entries ->
            new ZipOutputStream(new FileOutputStream(file("fixtures/${role}.zip"))).withCloseable { zip ->
                entries.each { name, content ->
                    zip.putNextEntry(new ZipEntry(name))
                    zip.write(content.getBytes('UTF-8'))
                    zip.closeEntry()
                }
            }
        }
        def retained = scenario in ['compiler-missing', 'malformed'] ? archives.plugin : archives.compiler
        retained.each { name, content ->
            def target = file('build/tools/nsis/' + name.replaceFirst('^nsis-3.12/', ''))
            target.parentFile.mkdirs()
            target.setText(content, 'UTF-8')
        }
        if (scenario == 'complete') {
            def plugin = file('build/tools/nsis/Plugins/x86-unicode/LockedList.dll')
            plugin.parentFile.mkdirs()
            plugin.setText('plugin-fixture', 'UTF-8')
        }
    }
}

tasks.named('downloadNSIS') { dependsOn 'prepareNsisFixture' }
tasks.register('verifyNsisSetup') {
    dependsOn 'downloadNSIS'
    doLast {
        assert file('build/tools/nsis/makensis.exe').text == 'compiler-fixture'
        assert file('build/tools/nsis/Include/MUI2.nsh').text == 'include-fixture'
        assert file('build/tools/nsis/Plugins/x86-unicode/LockedList.dll').text == 'plugin-fixture'
        def expected = [
                'compiler-missing': ['compiler'],
                'plugin-missing': ['plugin'],
                'complete': []
        ][scenario]
        assert downloads == expected: "Unexpected downloads for ${scenario}: ${downloads}"
        println "NSIS fixture passed: ${scenario}; downloads=${downloads}"
    }
}
