name: Bug report
description: Report a Copperbench bug (search for duplicates first)
type: bug
body:
  - type: checkboxes
    attributes:
      label: Checks
      options:
        - label: I searched existing issues in this Copperbench repository
          required: true
        - label: This is about Copperbench, not the official MCreator distribution
          required: true
  - type: textarea
    attributes:
      label: Issue description
      description: What went wrong?
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Area
      options:
        - Installation or update
        - Workspace
        - Generator or build
        - User interface or accessibility
        - MCP, headless, or SDK
        - Documentation
    validations:
      required: true
  - type: textarea
    attributes:
      label: How to reproduce
      placeholder: |
        Step 1: ...
        Step 2: ...
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Operating system
      options:
        - Windows 11 x64
        - Ubuntu 24.04 LTS x86_64 - GNOME Wayland
        - Ubuntu 24.04 LTS x86_64 - GNOME Xorg
        - Other (not validated; describe below)
    validations:
      required: true
  - type: textarea
    attributes:
      label: Version and source commit
      placeholder: |
        Copperbench version: from About or release metadata
        Source commit: full 40-character SHA from release metadata
        OS version/build and desktop session: Windows build, or Linux distribution and Wayland/Xorg
    validations:
      required: true
  - type: input
    attributes:
      label: Generator
      placeholder: fabric-1.21.1 / neoforge-26.2 / resource-pack
    validations:
      required: true
  - type: input
    attributes:
      label: Element type
      placeholder: block / item / recipe / procedure / not applicable
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    attributes:
      label: Diagnostic code or error ID
      description: Enter the structured diagnostic code and failure/error ID, or "none".
    validations:
      required: true
  - type: textarea
    attributes:
      label: Diagnostic bundle or logs
      description: Attach the exported redacted diagnostic bundle, paste text logs, or link a gist. Review optional reproduction files before uploading.
    validations:
      required: false
