name: Verify public Windows 0.1.9 assets

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download and verify every public Windows asset
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/output/minecraft-validation/public-windows-verification"
          payload="$RUNNER_TEMP/windows-public-payload"
          mkdir -p "$evidence"
          python - <<'PY'
          import os,re
          assert re.fullmatch('[0-9a-f]{40}',os.environ['SOURCE_SHA'])
          assert os.environ['GITHUB_REPOSITORY']=='Lotulune/Copperbench'
          PY
          git fetch --depth=1 origin "$SOURCE_SHA"
          gh api repos/Lotulune/Copperbench/releases/tags/v0.1.9 > "$evidence/public-release.json"
          gh release download v0.1.9 --repo Lotulune/Copperbench --dir "$payload"
          python scripts/cloud-acceptance/verify-public-assets.py --platform windows --source "$SOURCE_SHA" \
            --release "$evidence/public-release.json" --payload "$payload" --result "$evidence/public-verification.json"
          release_run="$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["workflowRun"])' "$payload/RELEASE-METADATA.json")"
          [[ "$release_run" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/Lotulune/Copperbench/actions/runs/$release_run" > "$evidence/release-run.json"
          python scripts/cloud-acceptance/verify-candidate-provenance.py --payload "$payload" \
            --metadata RELEASE-METADATA.json --workflow deploy.yml --source-ref refs/tags/v0.1.9 \
            --source "$SOURCE_SHA" --run "$release_run" --output "$evidence/provenance"
          python scripts/cloud-acceptance/verify-candidate-package.py \
            --archive "$payload/Copperbench.0.1.9.Windows.64bit.zip" --source "$SOURCE_SHA" \
            --result "$evidence/archive-entry-verification.json"
          cp "$payload/RELEASE-METADATA.json" "$payload/SHA256SUMS.txt" "$payload/product-status.json" "$evidence/"
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path('output/minecraft-validation/public-windows-verification')
          run=json.loads((root/'release-run.json').read_text())
          assert run['head_sha']==os.environ['SOURCE_SHA'] and run['conclusion']=='success'
          assert run['path']=='.github/workflows/deploy.yml'
          result={'status':'passed','kind':'cloud-public-windows-byte-verification','sourceCommit':os.environ['SOURCE_SHA'],
                  'releaseTag':'v0.1.9','releaseRun':str(run['id']),'verificationRun':os.environ['GITHUB_RUN_ID'],
                  'harnessCommit':os.environ['GITHUB_SHA'],'scope':'All ten public assets downloaded and matched API/checksum/provenance; package docs, version, fix classes and data-pack template inspected; installation acceptance is separate'}
          (root/'result.json').write_text(json.dumps(result,indent=2)+'\n')
          hashes={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          (root/'evidence-hashes.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-windows-0.1.9-verification
          path: output/minecraft-validation/public-windows-verification/
          if-no-files-found: error
          retention-days: 30
