name: Diagnose MCP conformance runner failure

# Temporary diagnostics; this file exists only on diag/** branches.
on:
  push:
    branches:
      - "diag/**"

permissions:
  contents: read

jobs:
  stress:
    name: Suite stress loop ${{ matrix.attempt }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 25 with JCEF
        uses: actions/setup-java@v6
        with:
          java-version: "25.0.2"
          distribution: jetbrains
          java-package: jdk+jcef
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-shell/package-lock.json
      - name: Install UI shell dependencies
        working-directory: ui-shell
        run: npm ci
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: "DIAG: snapshot before suite"
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/ci/diag-runner-state.ps1 -Phase before
      - name: Repeat MCP conformance suite
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/ci/diag-stress.ps1 -Iterations 12
      - name: Upload MCP conformance report
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: mcp-conformance-stress-${{ matrix.attempt }}
          path: build/mcp-conformance-results-*/
          if-no-files-found: warn
          retention-days: 3
      - name: "DIAG: state after upload"
        if: ${{ always() }}
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/ci/diag-runner-state.ps1 -Phase post-upload
