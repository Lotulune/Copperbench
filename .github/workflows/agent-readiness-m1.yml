name: Agent readiness M1 gates

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Public version to validate (empty runs the source M1 gates)'
        type: string
        required: false
        default: ''
      previous_release_tag:
        description: 'Public version to upgrade from, required with release_tag'
        type: string
        required: false
        default: ''
      packs_only:
        description: 'Supplemental data-pack/lifecycle checks only; does not replace the full Core gate'
        type: boolean
        required: false
        default: false
      windows_source_sha:
        description: 'Optional exact source SHA for full Windows release tests before creating a release tag'
        type: string
        required: false
        default: ''
      linux_candidate_run:
        description: 'Optional completed main Linux candidate run to verify in the cloud'
        type: string
        required: false
        default: ''
      linux_candidate_source:
        description: 'Exact source SHA for linux_candidate_run'
        type: string
        required: false
        default: ''
      windows_release_source:
        description: 'Optional exact source SHA for an independent public Windows 0.1.9 asset verification'
        type: string
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agent-readiness-m1.yml'
      # Exercise delivery when its implementation or build inputs change.
      - 'src/main/**'
      - 'src/gradleBridge/**'
      - 'src/test/**'
      - 'plugins/**'
      - 'sdk/python/**'
      - 'ui-core/schemas/**'
      - 'ui-core/scripts/**'
      - 'ui-core/package*.json'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/**'
      - 'platform/**'
      - 'lib/**'
      - 'ui-shell/package*.json'
      - 'ui-shell/vite.config.*'
      - 'ui-shell/tsconfig*.json'
      - 'ui-shell/scripts/**'
      - 'scripts/verify-field-contract-evidence.mjs'
      - 'scripts/tests/test_ci_selection.py'
      - 'examples/agent-readiness/m1-delivery/**'

permissions:
  contents: read
  attestations: read
  actions: read

jobs:
  protocol:
    if: ${{ !inputs.release_tag && !inputs.windows_source_sha && !inputs.linux_candidate_run && !inputs.windows_release_source }}
    name: M1 protocol and adapter contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v6
        with:
          java-version: "25.0.2"
          distribution: jetbrains
          java-package: jdk+jcef
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install UI build dependencies
        run: npm ci --prefix ui-shell
      - name: Run protocol and eight-track adapter contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/m1-protocol
          xvfb-run -a ./gradlew --no-daemon test \
            --tests dev.copperbench.headless.NativeApiSessionTest \
            --tests dev.copperbench.mcp.McpHttpServerTest \
            --tests dev.copperbench.core.workspace.mcreator.ElementFieldDiscoveryTest \
            --tests dev.copperbench.core.workspace.mcreator.NativeElementReferenceValidationTest \
            --tests dev.copperbench.generator.VerifiedArtifactExporterTest \
            --tests dev.copperbench.generator.GameTestReportTest \
            2>&1 | tee build/reports/m1-protocol/gradle.log
      - name: Test Native and MCP Python clients
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/m1-protocol
          python -m unittest discover -s sdk/python -p 'test_*.py' \
            2>&1 | tee build/reports/m1-protocol/python.log
      - name: Install contract validator
        run: npm ci --prefix ui-core
      - name: Validate actual adapter envelopes, examples and defaults
        run: node scripts/verify-field-contract-evidence.mjs
      - name: Preserve contract results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m1-protocol-adapter-results
          path: |
            build/test-results/
            build/reports/tests/
            build/reports/m1-discovery/
            build/reports/m1-protocol/
          if-no-files-found: warn

  delivery:
    if: ${{ !inputs.release_tag && !inputs.windows_source_sha && !inputs.linux_candidate_run && !inputs.windows_release_source }}
    name: M1 real Fabric delivery
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
      - name: Locate the Minecraft Java 21 runtime
        run: ln -s "$JAVA_HOME" jdk21
      - uses: actions/setup-java@v6
        with:
          java-version: "25.0.2"
          distribution: jetbrains
          java-package: jdk+jcef
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install UI build dependencies
        run: npm ci --prefix ui-shell
      - name: Build, break, repair, accept, export and reconnect using the real product
        shell: bash
        env:
          XDG_STATE_HOME: ${{ runner.temp }}/m1-delivery-state
        run: |
          set -euo pipefail
          mkdir -p build/reports/m1-delivery
          xvfb-run -a ./gradlew --no-daemon runAgentReadinessDelivery -PnativePythonExecutable=python \
            2>&1 | tee build/reports/m1-delivery/gradle.log
      - name: Preserve delivery evidence including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m1-real-delivery-results
          path: |
            build/reports/m1-delivery/
            build/m1-workspaces/*/.copperbench/task-records/
            logs/
            ${{ runner.temp }}/m1-delivery-state/copperbench/logs/
          if-no-files-found: warn

  published-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    uses: ./.github/workflows/published-release-acceptance.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      previous_release_tag: ${{ inputs.previous_release_tag }}
      packs_only: ${{ inputs.packs_only || false }}

  windows-source:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_source_sha != '' }}
    uses: ./.github/workflows/windows-source-verification.yml
    with:
      source_sha: ${{ inputs.windows_source_sha }}

  linux-candidate-verification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_candidate_run != '' }}
    uses: ./.github/workflows/linux-candidate-verification.yml
    with:
      source_sha: ${{ inputs.linux_candidate_source }}
      candidate_run: ${{ inputs.linux_candidate_run }}

  public-windows-verification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_release_source != '' }}
    uses: ./.github/workflows/public-windows-verification.yml
    with:
      source_sha: ${{ inputs.windows_release_source }}
