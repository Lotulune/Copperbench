name: Agent readiness M1 gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    name: M1 protocol and adapter contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: "25.0.2"
          distribution: jetbrains
          java-package: jdk+jcef
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install UI build dependencies
        run: npm ci --prefix ui-shell
      - name: Run protocol and eight-track adapter contracts
        run: >-
          xvfb-run -a ./gradlew --no-daemon test
          --tests dev.copperbench.headless.NativeApiSessionTest
          --tests dev.copperbench.mcp.McpHttpServerTest
          --tests dev.copperbench.core.workspace.mcreator.ElementFieldDiscoveryTest
          --tests dev.copperbench.generator.VerifiedArtifactExporterTest
          --tests dev.copperbench.generator.GameTestReportTest
      - name: Test Native and MCP Python clients
        if: always()
        run: python -m unittest discover -s sdk/python -p 'test_*.py'
      - name: Install contract validator
        run: npm ci --prefix ui-core
      - name: Validate actual adapter envelopes, examples and defaults
        run: node scripts/verify-field-contract-evidence.mjs
      - name: Preserve contract results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m1-protocol-adapter-results
          path: |
            build/test-results/
            build/reports/tests/
            build/reports/m1-discovery/
          if-no-files-found: warn

  delivery:
    name: M1 real Fabric delivery
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
      - name: Locate the Minecraft Java 21 runtime
        run: ln -s "$JAVA_HOME" jdk21
      - uses: actions/setup-java@v6
        with:
          java-version: "25.0.2"
          distribution: jetbrains
          java-package: jdk+jcef
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install UI build dependencies
        run: npm ci --prefix ui-shell
      - name: Build, break, repair, accept, export and reconnect using the real product
        run: xvfb-run -a ./gradlew --no-daemon runAgentReadinessDelivery -PnativePythonExecutable=python
      - name: Preserve delivery evidence including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m1-real-delivery-results
          path: |
            build/reports/m1-delivery/
            build/m1-workspaces/*/.copperbench/task-records/
            logs/
          if-no-files-found: warn
