name: Build Windows release

on:
  push:
    tags:
      - "v*"
      - "!v*-linux-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
      publish:
        description: Publish a verified GitHub release after packaging
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build traceable Windows packages
    runs-on: windows-latest
    environment: production
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      SHOULD_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag and clean source
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $mainCommit = (gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq .sha).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Unable to resolve the latest main commit" }
          pwsh -NoProfile -File ./scripts/verify-release-source.ps1 -Tag $env:RELEASE_TAG -ExpectedMainCommit $mainCommit
      - name: Set up JDK 25 with JCEF
        uses: actions/setup-java@v6
        with:
          java-version: "25.0.2"
          distribution: jetbrains
          java-package: jdk+jcef
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui-core/package-lock.json
            ui-shell/package-lock.json
      - name: Install UI dependencies
        shell: pwsh
        run: |
          npm ci --prefix ui-core
          if ($LASTEXITCODE -ne 0) { throw 'UI contract dependency installation failed' }
          npm ci --prefix ui-shell
          if ($LASTEXITCODE -ne 0) { throw 'UI shell dependency installation failed' }
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run release tests
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon --no-build-cache clean test javadoc
          if ($LASTEXITCODE -ne 0) { throw 'Release Java tests and Javadoc failed' }
          npm test --prefix ui-core
          if ($LASTEXITCODE -ne 0) { throw 'Release UI contract tests failed' }
          npm run build --prefix ui-shell
          if ($LASTEXITCODE -ne 0) { throw 'Release UI build failed' }
      - name: Build unsigned Windows packages
        shell: pwsh
        run: |
          $buildDate = Get-Date -Format 'yyyyMMddHHmm'
          .\gradlew.bat --no-daemon --no-build-cache exportWindowsZip buildInstallerWin64 buildMsixWin64 "-Pbuilddate=$buildDate"
          if ($LASTEXITCODE -ne 0) { throw 'Windows package build failed' }
      - name: Collect release binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/release | Out-Null
          Get-ChildItem build/export -File |
            Where-Object Extension -In '.exe', '.zip', '.msix' |
            Copy-Item -Destination build/release
          Copy-Item LICENSE.txt, LICENSE-ADDITIONAL-TERMS.md, product-status.json, compliance/THIRD_PARTY_NOTICES.md -Destination build/release
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: build/export/win64
          format: spdx-json
          output-file: build/release/copperbench.spdx.json
          artifact-name: copperbench-windows-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate hashes and source metadata
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/New-ReleaseMetadata.ps1 -Tag $env:RELEASE_TAG -ReleaseDirectory build/release
      - name: Verify release payload
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-ReleasePayload.ps1 -ReleaseDirectory build/release
      - name: Generate build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: build/release/*
      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: copperbench-${{ env.RELEASE_TAG }}-windows
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Create draft release and upload payload
        if: env.SHOULD_PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $mainCommit = (gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq .sha).Trim()
          $tagCommit = (git rev-parse "$env:RELEASE_TAG^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $mainCommit) {
            throw "Release tag $env:RELEASE_TAG no longer matches latest main $mainCommit"
          }
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.isDraft) { throw "Release $env:RELEASE_TAG is already public and cannot be overwritten" }
          } else {
            $stable = $env:RELEASE_TAG -match '^v\d+\.\d+\.\d+$'
            $notes = if ($stable) { 'docs/releases/v0.1.1.md' } else { 'docs/releases/preview-template.md' }
            gh release create $env:RELEASE_TAG --verify-tag --draft "--prerelease=$(!$stable)" --title "Copperbench $env:RELEASE_TAG" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to create draft release $env:RELEASE_TAG" }
          }
          Get-ChildItem build/release -File | ForEach-Object {
            gh release upload $env:RELEASE_TAG $_.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $($_.Name)" }
          }
      - name: Verify draft assets before publishing
        if: env.SHOULD_PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pwsh -NoProfile -File ./scripts/Test-ReleaseAssets.ps1 -Tag $env:RELEASE_TAG
      - name: Publish verified release
        if: env.SHOULD_PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $mainCommit = (gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq .sha).Trim()
          $tagCommit = (git rev-parse "$env:RELEASE_TAG^{commit}").Trim()
          $metadataCommit = (Get-Content -LiteralPath build/release/RELEASE-METADATA.json -Raw | ConvertFrom-Json).commit
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $mainCommit -or $metadataCommit -ne $mainCommit) {
            throw "Release source changed before publication: main=$mainCommit tag=$tagCommit metadata=$metadataCommit"
          }
          $stable = $env:RELEASE_TAG -match '^v\d+\.\d+\.\d+$'
          gh release edit $env:RELEASE_TAG --draft=false "--prerelease=$(!$stable)"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish verified release' }
