name: Build and test

on:
  push:
    branches:
      - main
      - "feature/**"
      - "dev/**"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java tests and Javadoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 25 with JCEF
        uses: actions/setup-java@v6
        with:
          java-version: "25.0.2"
          distribution: jetbrains
          java-package: jdk+jcef
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-shell/package-lock.json
      - name: Install UI shell dependencies
        working-directory: ui-shell
        run: npm ci
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Compile, test, and generate Javadoc
        run: xvfb-run -a ./gradlew --no-daemon --no-build-cache clean test javadoc
      - name: Publish Java test report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16
        if: always()
        with:
          include_passed: true
          detailed_summary: true
          report_paths: "**/build/test-results/test/TEST-*.xml"
      - name: Upload Java diagnostics
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: java-diagnostics
          path: |
            build/reports/tests/
            build/reports/problems/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: UI contract, build, and smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui-core/package-lock.json
            ui-shell/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install UI contract dependencies
        working-directory: ui-core
        run: npm ci
      - name: Install UI shell dependencies
        working-directory: ui-shell
        run: npm ci
      - name: Validate UI schemas
        working-directory: ui-core
        run: npm test
      - name: Build UI shell
        working-directory: ui-shell
        run: npm run build
      - name: Install Chromium
        working-directory: ui-shell
        run: npx playwright install --with-deps chromium
      - name: Run fast product-shell smoke tests
        working-directory: ui-shell
        run: npx playwright test e2e/scenarios.spec.ts e2e/new-workspace.spec.ts e2e/sdk-connection-security.spec.ts --project=chromium
      - name: Test Python SDK connection metadata security
        run: python sdk/python/test_connection_security.py
      - name: Validate product status
        run: node scripts/verify-product-status.mjs
      - name: Check repository Markdown links
        run: node scripts/verify-markdown-links.mjs
      - name: Upload Playwright diagnostics
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-diagnostics
          path: |
            ui-shell/playwright-report/
            ui-shell/test-results/
          if-no-files-found: ignore
          retention-days: 14

  mcp-conformance:
    name: MCP conformance
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 25 with JCEF
        uses: actions/setup-java@v6
        with:
          java-version: "25.0.2"
          distribution: jetbrains
          java-package: jdk+jcef
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-shell/package-lock.json
      - name: Install UI shell dependencies
        working-directory: ui-shell
        run: npm ci
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Verify signed release-source gate
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/tests/verify-release-source.tests.ps1
      - name: Run Stage 9 clean Windows harness regression tests
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/tests/Stage9CleanWindowsHarness.tests.ps1
      - name: Run MCP conformance suite
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/verify-mcp-conformance.ps1 -OutputDirectory build/mcp-conformance-results
      - name: Upload MCP conformance report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mcp-conformance-results
          path: build/mcp-conformance-results/
          if-no-files-found: error
          retention-days: 30
