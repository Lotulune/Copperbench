name: Published release cloud acceptance

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      previous_release_tag:
        required: true
        type: string

permissions:
  contents: read
  attestations: read

jobs:
  installed:
    name: Public package / ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            variant: windows-setup
          - os: ubuntu-24.04
            variant: linux-setup
          - os: ubuntu-24.04
            variant: deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Only test drivers are compiled. Installed product processes use the released bundled JDK.
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
      - name: Prepare Linux virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth fonts-noto-cjk
      - name: Accept public Windows installer and installed Native Core
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREVIOUS_RELEASE_TAG: ${{ inputs.previous_release_tag }}
          VARIANT: ${{ matrix.variant }}
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/cloud-acceptance/run.py --release-tag $env:RELEASE_TAG --previous-release-tag $env:PREVIOUS_RELEASE_TAG --variant $env:VARIANT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Accept public Linux package and installed Native Core
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREVIOUS_RELEASE_TAG: ${{ inputs.previous_release_tag }}
          VARIANT: ${{ matrix.variant }}
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1440x1000x24' python scripts/cloud-acceptance/run.py \
            --release-tag "$RELEASE_TAG" --previous-release-tag "$PREVIOUS_RELEASE_TAG" --variant "$VARIANT"
      - name: Preserve acceptance evidence and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-release-${{ matrix.variant }}-${{ github.run_attempt }}
          path: output/minecraft-validation/cloud-release/${{ matrix.variant }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
